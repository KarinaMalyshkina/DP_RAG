[project]
name = "dp-rag-eval"
version = "0.1.0"
description = "A unified evaluation framework for Differentially Private RAG systems"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.46",
    "numpy>=1.24",
    "autodp>=0.2.3",
    "dp-accounting>=0.4.4",
    "sentence-transformers>=3.0",
    "termcolor>=2.0",
    "faker>=30.0",
    "datasets>=3.1",
]

[project.optional-dependencies]
gpu = [
    "vllm>=0.6",
    "faiss-cpu>=1.7.4",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dp_rag_eval"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
