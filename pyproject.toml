[project]
name = "dp-rag-eval"
version = "0.1.0"
description = "A unified evaluation framework for Differentially Private RAG systems"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    # The `qwen3_5` architecture is registered from transformers 5.x; a 4.x release
    # would fail to load the model with "unrecognized model type". 5.8.1 is the
    # version the framework was verified against — do not lower this floor.
    "transformers>=5.8",
    "accelerate>=1.0",
    "huggingface-hub>=0.26",
    "hf-transfer>=0.1.8",
    "numpy>=1.24",
    "autodp>=0.2.3",
    "dp-accounting>=0.4.4",
    "sentence-transformers>=3.0",
    "termcolor>=2.0",
    "faker>=30.0",
    "datasets>=3.1",
]

[project.optional-dependencies]
gpu = [
    "vllm>=0.6",
    "faiss-cpu>=1.7.4",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

# PyPI's default `torch` wheel is built against the newest CUDA (cu130 as of this
# writing) and silently falls back to CPU on a driver that is older — which on a
# rented box means the whole matrix runs at CPU speed unless bootstrap catches it.
# The RTX A6000 / L40S pods this runbook targets ship driver 570.x = CUDA 12.8, so
# torch is resolved from the cu128 index instead of PyPI.
#
# This must live here rather than being fixed with a one-off `uv pip install`: any
# later `uv sync` re-resolves from pyproject and would put the mismatched build
# back, leaving a half-replaced environment that fails on a missing CUDA .so.
#
# On a box with a *different* driver, change the URL to the matching cuXXX index
# (https://download.pytorch.org/whl/). `bootstrap_gpu.sh` hard-fails with the driver
# version when the two do not match, so a wrong pin cannot pass silently.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dp_rag_eval"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
