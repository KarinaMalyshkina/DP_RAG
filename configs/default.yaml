experiment:
  name: "default_experiment"
  seed: 42
  output_dir: "runs/"

pipeline:
  type: "koga"
  model: "facebook/opt-1.3b"
  device: "cuda"
  koga:
    n_split: 50
    n_docs: 1
    max_length: 20
    below_threshold: false
    threshold: 0.5
    sparse_eps: 1.0
    fail_mode: "zero"
  grislain:
    alpha: 4.0
    omega: 1.0
    temperature: 1.0
    max_new_tokens: 50
    top_k: 10
    embedding_model: "Snowflake/snowflake-arctic-embed-m-v1.5"

privacy:
  epsilon: 1.0
  delta: 1.0e-5

dataset:
  loader: "synthetic_medical"
  variant: "original"
  variant_params: {}
  max_docs: 100

attacks: []

metrics:
  utility:
    - exact_match
    - f1
  privacy:
    - attack_success_rate
    - tpr_at_fpr_01
